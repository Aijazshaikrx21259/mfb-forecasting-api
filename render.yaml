services:
  - type: web
    name: mfb-forecasting-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        sync: false
      - key: API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: PIPELINE_AUTO_RUN
        value: "false"
      - key: PIPELINE_INITIAL_DELAY_SECONDS
        value: "60"
      - key: PIPELINE_INTERVAL_MINUTES
        value: "1440"
      - key: PIPELINE_RUN_ON_DEMAND
        value: "true"
      - key: PORT
        value: 8000
    healthCheckPath: /health
