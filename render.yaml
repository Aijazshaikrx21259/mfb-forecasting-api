services:
  - type: web
    name: mfb-forecasting-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: oregon
    plan: free
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PIPELINE_AUTO_RUN
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
      - key: PORT
        value: 8000
    healthCheckPath: /health
