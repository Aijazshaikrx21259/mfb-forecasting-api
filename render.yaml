services:
  - type: web
    name: mfb-forecasting-api
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: PIPELINE_AUTO_RUN
        value: false
      - key: DATABASE_URL
        sync: false
      - key: API_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: "*"
    healthCheckPath: /health

